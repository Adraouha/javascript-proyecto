<!DOCTYPE html>

    <link rel="preconnect" href="https://fonts.googleapis.com">

            <div class="button-group">
                <button onclick="ejecutarEjercicio3()">Comprar</button>
                <button class="btn-secondary" onclick="limpiarEjercicio(3)">Limpiar</button>

    <footer>
